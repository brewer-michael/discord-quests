# Which SRD 5.2.1 creatures join the bestiary, and how. tools/gen-bestiary.ts reads this with the SRD stat
# blocks and writes packages/core/src/srd/bestiary.generated.ts. A creature not listed here is left out.
#
# Left out on purpose: fiends (demons, devils and the like; gnolls and sahuagin stay), flesh-eating and
# grotesque undead (zombies, ghouls, mummies, vampires, liches, crawling claws), body-horror aberrations,
# lycanthropes other than the werewolf, and anything above challenge rating 13 (beyond a level-10 party).
#
# Each entry:
#   i     the gentlest intensity it may appear at: light, classic or epic
#   h     habitats: forest meadow hills mountain caves marsh river coast sea desert arctic ruins town volcano
#   d     one line in the world's voice, safe at that intensity
# Optional: name (a new name), kind, defeat, morale, friendly (never a random foe), tags, boss (a big fight),
#   rename (attack or trait names to change), drop (attacks or traits to leave out), multi (a multiattack the
#   data doesn't spell out, as { attack name: count }), defense (agile, hide, armor or ward, when the numbers
#   mislead)

