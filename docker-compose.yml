# Local development: `docker compose up postgres` for just the database,
# or `docker compose --profile bot up` for the database, the bot and the setup page (needs a .env file).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dq
      POSTGRES_PASSWORD: dq
      POSTGRES_DB: dq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://dq:dq@postgres:5432/dq
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["bot"]

  web:
    build: .
    command: ["pnpm", "--filter", "@dq/web", "start"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://dq:dq@postgres:5432/dq
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/privacy').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      bot:
        condition: service_started
    restart: unless-stopped
    profiles: ["bot"]

volumes:
  pgdata:
