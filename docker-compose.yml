# Local development: `docker compose up -d postgres` gives you a database on localhost:5432
# (DATABASE_URL=postgres://dq:dq@localhost:5432/dq).
# To run the whole thing on a server, use docker-compose.prod.yml (see docs/RUNNING.md).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dq
      POSTGRES_PASSWORD: dq
      POSTGRES_DB: dq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
