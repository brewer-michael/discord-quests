# Local development: `docker compose up postgres` for just the database,
# or `docker compose up` for the database and the bot (needs a .env file).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dq
      POSTGRES_PASSWORD: dq
      POSTGRES_DB: dq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://dq:dq@postgres:5432/dq
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["bot"]

volumes:
  pgdata:
