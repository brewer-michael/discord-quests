id: openrouter
kind: llm
label: OpenRouter (many models, one key)
description: An OpenAI-compatible service. Pick a model from the list the service provides.
adapter: openai_compat
baseUrl: https://openrouter.ai/api/v1
baseUrlEditable: false
selfHosted: false
auth: { type: bearer }
needsKey: true
keyUrl: https://openrouter.ai/keys
capabilities: { structured: json_schema, promptCache: implicit, effort: false, serverFallbacks: false, maxTokensParam: max_tokens }
models: []
