id: together
kind: llm
label: Together AI
description: Hosted open models.
adapter: openai_compat
baseUrl: https://api.together.ai/v1
baseUrlEditable: false
selfHosted: false
auth: { type: bearer }
needsKey: true
keyUrl: https://api.together.ai/settings/api-keys
# docs.together.ai: reasoning_effort (low, medium, high; some models also max), and reasoning: { enabled: false } to
# switch thinking off on hybrid models. Reasoning comes back in its own field and shares max_tokens with the
# answer. json_schema on models with Structured Outputs; json_object otherwise. Its serverless models list no
# longest answer. Read from search summaries of Together's pages.
capabilities:
  { structured: json_object, promptCache: implicit, effort: false, serverFallbacks: false, maxTokensParam: max_tokens, reasoning: reasoning_enabled }
docs:
  - https://docs.together.ai/docs/inference/chat/reasoning
  - https://docs.together.ai/reference/chat-completions
  - https://docs.together.ai/docs/inference/chat/structured-outputs
  - https://docs.together.ai/docs/serverless/models
checked: 2026-10-17
models:
  - id: moonshotai/Kimi-K3
    label: Kimi K3
    pricing: { input: 3, output: 15 }
    contextWindow: 1048576
    reasoning: { mode: optional, efforts: [none, low, high, max], default: max }
    structured: json_schema
    note: Together's recommended chat model. It accepts unknown levels silently.
  - id: zai-org/GLM-5.3
    label: GLM-5.3
    contextWindow: 1048575
    reasoning: { mode: always, efforts: [low, medium, high, max] }
    structured: json_schema
    note: Thinking can't be switched off.
  - id: deepseek-ai/DeepSeek-V4-Pro-0813
    label: DeepSeek V4 Pro
    contextWindow: 1048576
    reasoning: { mode: optional, efforts: [none, high, max] }
    structured: json_schema
    note: Thinks by default. Other levels act as high or max.
  - id: MiniMaxAI/MiniMax-M3
    label: MiniMax M3
    contextWindow: 524288
    reasoning: { mode: optional }
    structured: json_schema
    note: Thinking switches on or off; its levels aren't documented.
  - id: Qwen/Qwen3.6-Plus
    label: Qwen3.6 Plus
    contextWindow: 1000000
    reasoning: { mode: optional }
    structured: json_schema
    note: Thinks by default.
  - id: openai/gpt-oss-120b
    label: GPT-OSS 120B
    contextWindow: 131072
    reasoning: { mode: always, efforts: [low, medium, high], default: medium }
    structured: json_schema
defaultModels:
  narrator: moonshotai/Kimi-K3
  director: moonshotai/Kimi-K3
  writer: moonshotai/Kimi-K3
  summarizer: openai/gpt-oss-120b
  intent: openai/gpt-oss-120b
  safety: openai/gpt-oss-120b
  judge: openai/gpt-oss-120b
