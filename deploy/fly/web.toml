# Fly.io config for the setup page. From the repository root:
#   fly launch --no-deploy --copy-config --config deploy/fly/web.toml --name <your-web-app>
#   fly secrets set --config deploy/fly/web.toml DISCORD_CLIENT_ID=... DISCORD_CLIENT_SECRET=... \
#     DATABASE_URL=... MASTER_KEYS=... WEB_BASE_URL=https://<your-web-app>.fly.dev
#   fly deploy --config deploy/fly/web.toml --dockerfile Dockerfile
app = "discord-quests-web"
primary_region = "iad"

[processes]
  app = "node apps/web/node_modules/next/dist/bin/next start apps/web"

[env]
  PORT = "3000"
  LOG_FORMAT = "json"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/privacy"

[[vm]]
  memory = "512mb"
  cpus = 1
