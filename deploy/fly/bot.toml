# Fly.io config for the bot. From the repository root:
#   fly launch --no-deploy --copy-config --config deploy/fly/bot.toml --name <your-bot-app>
#   fly secrets set --config deploy/fly/bot.toml DISCORD_TOKEN=... DISCORD_CLIENT_ID=... DATABASE_URL=... MASTER_KEYS=...
#   fly deploy --config deploy/fly/bot.toml --dockerfile Dockerfile
#   fly scale count 1 --config deploy/fly/bot.toml
app = "discord-quests-bot"
primary_region = "iad"

[env]
  LOG_FORMAT = "json"
  HEALTH_PORT = "8080"

# The bot keeps a gateway connection open: never auto-stop it, and run exactly one machine.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "get"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpus = 1
