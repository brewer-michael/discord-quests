id: act1
number: 1
title: The Dimming
summary: >-
  The great lantern of Hearthmoor goes out on Festival Eve. The heroes set off to fetch new flame from
  Lantern Hall in the Reedmarsh, and discover that the trouble is much bigger than one village.
detail: full
chapters:
  - id: ch1
    number: 1
    title: Lights Out in Hearthmoor
    summary: Festival Eve goes dark, a lantern-thief is caught, and the heroes take up the quest.
    regions: [hearthmoor]
    beats:
      - id: ch1-the-last-flame
        title: The Last Flame
        kind: exploration
        region: hearthmoor
        poi: hearthmoor-square
        summary: >-
          It's Festival Eve, and all of Hearthmoor is crowded into Lantern Square for the lighting. Just as
          Hattie Wick raises her taper, the great lantern sputters, flickers and goes out. In the dark,
          something laughs in the dark, and someone notices sooty footprints leading away.
        goals:
          - Meet each other and the people of Hearthmoor.
          - Discover that the lantern's flame-coal is missing.
        introduces: [mayor-hobb, hattie-wick]
        virtueOpportunities:
          - tag: kindness_to_lowly
            note: Comfort the frightened little ones in the square.

      - id: ch1-the-thief-in-the-lamp-house
        title: The Thief in the Lamp-House
        kind: social
        region: hearthmoor
        poi: lamp-house
        summary: >-
          The footprints lead to the Lamp-House, where the heroes catch a small grey figure hugging the last
          warm coal: Snibbet, a lantern-thief, shivering so hard his teeth chatter. Villagers come running,
          angry and scared. Mayor Hobb wants him locked in the cellar until the Gilded Ledger's bounty-men
          come to take him away.
        goals:
          - Catch the thief.
          - Decide what happens to Snibbet.
        requires: [ch1-the-last-flame]
        introduces: [snibbet]
        virtueOpportunities:
          - tag: mercy
            target: snibbet
            note: Let Snibbet go, speak up for him, or share warmth with him instead of handing him over.
          - tag: kindness_to_lowly
            target: snibbet
            note: Give Snibbet something warm, like a scarf, a meal or a kind word.
          - tag: honesty_at_cost
            note: Tell the villagers the truth about what happened, even if it makes them cross.

      - id: ch1-hatties-request
        title: Hattie's Request
        kind: social
        region: hearthmoor
        poi: lamp-house
        summary: >-
          Old Hattie Wick explains that the lantern needs new flame from Lantern Hall in the Reedmarsh,
          where the Lamplighters keep flame carried from the Ember itself. She is too old for the road. She
          asks the heroes to go, and gives them her own Hearth-Lantern to carry the flame home.
        goals:
          - Accept the quest.
          - Receive Hattie's Hearth-Lantern.
        requires: [ch1-the-thief-in-the-lamp-house]
        quest:
          id: fetch-new-flame
          title: Fetch a New Flame
          objective: Travel to Lantern Hall in the Reedmarsh and bring back new flame for Hearthmoor.
        virtueOpportunities:
          - tag: promise_kept
            target: hattie-wick
            note: Promise Hattie to bring the flame home, and later keep that promise.

      - id: ch1-gloam-in-the-garden
        title: Gloam in the Garden
        kind: combat
        region: hearthmoor
        poi: goose-commons
        summary: >-
          With the lantern dark, the Gloam Host creeps in. Gloom mites scuttle through the gardens, pinch
          out candles and terrify the geese. The heroes must drive them off. The geese may or may not help.
        goals:
          - Defend the village from the gloom mites.
          - Learn that the Gloam Host fears light.
        milestone: true
        foes:
          - { creature: gloom-mite, count: [2, 3] }
          - { creature: gloam-skulker, count: [1, 1] }

  - id: ch2
    number: 2
    title: The Whisperwood
    summary: The long road or the Fox's door; a lost child; a hollow oak; a night of howling.
    regions: [whisperwood]
    beats:
      - id: ch2-the-fork-in-the-road
        title: The Fork in the Road
        kind: choice
        region: whisperwood
        poi: foxglove-glade
        summary: >-
          At the edge of the Whisperwood, the Old Road bends the long way round: three whole days of walking.
          In a glade full of foxgloves, a fox in a plum velvet waistcoat bows low and offers a much quicker
          way.
        goals:
          - Choose the road, the long way around or the Fox's door.
        introduces: [saffron-the-fox]
        offersShortcuts: [fox-door, borrowed-luck]
        virtueOpportunities:
          - tag: patience
            note: Politely turn down the Fox's door and take the long road.
          - tag: keepsake_kept
            note: Refuse to trade away a keepsake from home.

      - id: ch2-the-lost-river-child
        title: The Lost River Child
        kind: social
        region: whisperwood
        poi: whispering-stream
        summary: >-
          By a chattering stream, a small River Folk girl named Tumble sits crying. She chased a heron and
          got lost, and her family is a whole day's walk out of the way, deep in the Reedmarsh.
        goals:
          - Help Tumble, one way or another.
        introduces: [tumble]
        offersShortcuts: [leave-tumble-behind]
        sockets: [ally_arrives]
        virtueOpportunities:
          - tag: kindness_to_lowly
            target: tumble
            note: Take Tumble home, even though it costs a day.
          - tag: promise_kept
            target: tumble
            note: Promise to get her home safely, and keep it.

      - id: ch2-the-hollow-oak
        title: The Hollow Oak
        kind: exploration
        region: whisperwood
        poi: the-hollow-oak
        optional: true
        summary: >-
          A huge hollow oak carved with the Wardens' leaf holds a supply cache. A sign says it is for any
          traveler in true need, and asks them to take only what they must.
        goals:
          - Find the Wardens' cache.
        offersShortcuts: [take-the-warden-cache]
        sockets: [hidden_way]
        virtueOpportunities:
          - tag: honesty_at_cost
            note: Take only what is truly needed, or leave a note and a coin for the Wardens.

      - id: ch2-shadow-wolves
        title: Howls in the Dark
        kind: combat
        region: whisperwood
        summary: >-
          Night falls in the wood and the shadow wolves begin to howl. Every howl makes the lanterns
          flicker. The heroes must keep their light burning until morning.
        goals:
          - Get through the night.
          - Keep the Hearth-Lantern lit.
        foes:
          - { creature: shadow-wolf, count: [2, 2] }
          - { creature: gloom-mite, count: [1, 2] }

  - id: ch3
    number: 3
    title: The Reedmarsh Toll
    summary: A bridge with a price, a hall on stilts, and a long night under siege.
    regions: [reedmarsh]
    beats:
      - id: ch3-the-toll-bridge
        title: The Toll Bridge
        kind: social
        region: reedmarsh
        poi: silas-toll-bridge
        summary: >-
          The only bridge into the heart of the Reedmarsh belongs to Silas Coin of the Gilded Ledger, and the
          toll has gone up to fifty gold a head. Silas is also selling lantern oil at triple the price.
        goals:
          - Find a way across the river.
        introduces: [silas-coin]
        offersShortcuts: [forged-toll-token]
        bypass:
          deeds: [kindness_to_lowly, promise_kept]
          target: tumble
          how: >-
            Tumble's family poles the heroes through the back channels on a flat boat, past Coin Bridge and its
            toll, to the foot of Lantern Hall.
        virtueOpportunities:
          - tag: honesty_at_cost
            target: silas-coin
            note: Refuse the forged token and find an honest way across.

      - id: ch3-lantern-hall
        title: Lantern Hall
        kind: social
        region: reedmarsh
        poi: lantern-hall
        summary: >-
          Lantern Hall stands on tall stilts above the reeds. Inside, Amberly Quill of the Lamplighters has
          terrible news. The Guild's own flame is failing, the Ember has been stolen by the Gloam King, and
          the Gloam Host is gathering in the marsh tonight.
        goals:
          - Learn what has happened to the Ember.
          - Help the Lamplighters get ready for the night.
        requires: [ch3-the-toll-bridge]
        introduces: [amberly-quill, granny-reed]
        sockets: [ally_arrives, hidden_way]

      - id: ch3-the-siege-of-lantern-hall
        title: The Siege of Lantern Hall
        kind: crux
        region: reedmarsh
        poi: lantern-hall
        summary: >-
          When night falls, the Gloam Host comes in wave after wave of shadows, trying to pinch out the
          Hall's very last lantern. If it goes out, the Guild's flame is lost. The heroes must hold the Hall
          until dawn.
        goals:
          - Keep the last lantern lit until dawn.
        requires: [ch3-lantern-hall]
        decisive: true
        crux:
          type: hold_the_line
          check:
            ability: con
            label: Hold Fast
            dc: { base: 14, perEnemyClockSegment: 1, perSnareSeverity: 1, max: 30 }
          clock: { faction: gloam-host, clock: long-night }
          sockets:
            - type: ally_arrives
              accepts: [kindness_to_lowly, promise_kept]
              faction: river-folk
              hint: River Folk boats glide out of the dark, every one hung with a lantern.
            - type: hidden_way
              accepts: [patience, honesty_at_cost, kindness_to_lowly]
              hint: The Old Sluice under the Hall lets someone bring fresh oil up from the flooded cellar.
            - type: spared_one_acts
              accepts: [mercy]
              anchorTag: covets-ember
              hint: >-
                Snibbet, who has followed the heroes all the way from Hearthmoor, relights the lantern from a
                spark he had been hiding for himself.
          requiredGrace: 0.9
          onSuccess: The heroes hold the Hall! At dawn the shadows melt away, and the last lantern is still burning.
          onCostlySuccess: >-
            The lantern survives, but only just. The Hall's great oil-store is spilled into the marsh, and the
            Lamplighters will have very little flame to spare.
          onFailForward:
            text: >-
              At the darkest hour the last lantern goes out. But the heroes kept the shadows away from the
              Lamplighters themselves, and at dawn Amberly gives them the Guild's final candle-stub. It is a
              weak light to travel by, but it is light.

      - id: ch3-the-road-ahead
        title: The Road Ahead
        kind: social
        region: reedmarsh
        poi: lantern-hall
        summary: >-
          At dawn, Amberly explains that only the First Forge on Mount Cinder can rekindle the Ember, and the
          Ember is locked inside Gloamhold. The road ahead is long. It always was.
        goals:
          - Take up the greater quest.
        requires: [ch3-the-siege-of-lantern-hall]
        milestone: true
        quest:
          id: rekindle-the-ember
          title: Rekindle the Ember
          objective: Recover the Ember from Gloamhold and carry it to the First Forge on Mount Cinder.
