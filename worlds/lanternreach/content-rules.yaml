substitutions:
  - avoid: killed
    prefer: defeated, sent running, or popped into smoke
  - avoid: died
    prefer: faded away, was carried off, or fell into a deep, deep sleep
  - avoid: blood or wounds
    prefer: bumps, bruises and scrapes
  - avoid: a dead body
    prefer: a heap of shadow that blows away like ash
  - avoid: ale or wine
    prefer: warm cocoa, apple juice, or berry tea
  - avoid: poison
    prefer: something that makes you feel queasy
