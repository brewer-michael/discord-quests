# What the story may and may not contain. Every campaign is for players aged 8 and up; its intensity
# (Light, Classic or Epic, chosen with the campaign) decides how dark it gets. The hard limits hold at every
# intensity and no setting unlocks them.
hardLimits:
  - "Nothing grotesque: no gore, no wounds or injuries described in detail, no mutilation or body horror, no
    lingering on fallen bodies or on suffering, and no torture."
  - "Nothing sexual or suggestive, and no nudity. Romance, if it appears at all, is no more than a fond glance or
    a held hand."
  - "Dark magic may exist only as a threat, shown through its effects: a creeping chill, withered fields, the fear
    it spreads. Never describe how it is done: no rituals, sacrifices, incantations or summonings. Heroes never
    learn or use it, and it is never made appealing."
  - No profanity or slurs, no self-harm, no drugs or drunkenness, and no real-world religions or politics.
  - No cruelty to children or animals shown on the page.
  - "Player characters are never killed. A hero at 0 hit points is Dazed: knocked out of the fight until a friend
    helps or they rally."
  - Never mock a player. Never ask for or repeat a player's real name, age, school, address or other personal
    details.
levels:
  light:
    description: A fireside tale. Mild peril and scuffles; foes run off, give up or are caught, and nobody dies.
    rules:
      - Nobody dies or is badly hurt. Defeated foes faint, flee, surrender, or (for shadow creatures) come apart
        into smoke.
      - Hits are knocks, tumbles and scrapes.
      - Frightening things stay spooky rather than menacing. Shadows, howls and creaky doors, never cruelty.
      - Sad or frightened moments are soon met with comfort and hope.
      - No alcohol and no betting games.
    substitutions:
      - avoid: killed
        prefer: defeated, sent running, or captured
      - avoid: died
        prefer: was carried off, or fell into a deep, enchanted sleep
      - avoid: a fallen body
        prefer: a heap of shadow that blows away like ash
      - avoid: ale or wine
        prefer: spiced tea, warm milk with honey, or berry cordial
      - avoid: poison
        prefer: something that makes you feel queasy
    bannedTerms:
      - kill
      - kills
      - killed
      - killing
      - die
      - dies
      - died
      - dying
      - dead
      - death
      - deadly
      - beer
      - wine
      - ale
      - gamble
      - gambling
  classic:
    description: Like The Hobbit. Real danger and menace, fierce battles, loss and grief, all told without gore.
    rules:
      - Danger is real. Villains are menacing, beasts are dangerous, and the heroes must earn their way out of
        peril.
      - Battles can be fierce, with swords, arrows and spells. Foes can be defeated, driven off, captured, or fall
        in battle. Say so briefly and move on; never dwell on it.
      - A side character may be lost. Let it matter and be mourned, told with restraint.
      - Fear, grief and hardship can be felt. Hope is never fully lost.
      - Inns and feasts may have ale and wine in the background, never drunkenness.
    substitutions:
      - avoid: describing a wound
        prefer: what it means for the fight, such as a hero staggering or a foe falling back
      - avoid: describing a fallen body
        prefer: the moment itself and what it means to those still standing
  epic:
    description: Like The Lord of the Rings. War, truly menacing villains, sacrifice and slow dread.
    rules:
      - Everything allowed at Classic, with heavier stakes. War and sieges can shape the story.
      - Villains can be truly menacing. Show their cruelty through what it has done to the land and its people,
        never by depicting it.
      - Sacrifice and loss can shape the story, and a beloved side character may fall.
      - Dread can build slowly and the darkness can seem to be winning, but hope endures.
      - Inns and feasts may have ale and wine in the background, never drunkenness.
    substitutions:
      - avoid: describing a wound
        prefer: what it means for the fight, such as a hero staggering or a foe falling back
      - avoid: describing a fallen body
        prefer: the moment itself and what it means to those still standing
      - avoid: showing a villain's cruelty
        prefer: its aftermath, such as a burned village, frightened survivors, or a silenced song
bannedTerms:
  - blood
  - bloody
  - bleed
  - bleeding
  - gore
  - gory
  - murder
  - corpse
  - suicide
  - torture
  - drunk
  - hell
  - damn
  - slaughter
  - behead
  - guts
  - sexy
  - sexual
  - seduce
  - seductive
  - lust
  - pentagram
  - satanic
  - human sacrifice
  - ritual sacrifice
  - blood ritual
