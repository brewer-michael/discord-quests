id: lanternreach
name: Lanternreach
version: 1
tagline: Where the lanterns hold back the Long Night, for now.
summary: >-
  For a thousand years the Hearth-Lanterns of Lanternreach have burned with flame carried from the Ember,
  a warm star-coal kept in the First Forge on top of Mount Cinder. Every spring the Lamplighters carry new
  flame along the Old Road to every village. This year the flame never came. The Gloam King, who cannot
  stand any light he did not make himself, has carried the Ember away to Gloamhold. One by one the lanterns
  are dimming, and in the dark places the Gloam Host grows bold. Heroes must decide how to set things
  right: the Long Road, slow and honest, or the Quick Way.
audience: family
startRegion: hearthmoor
startingLevel: 1
maxLevel: 10
artStyle: >-
  warm lantern light against cool blue twilight, a land of old roads, deep forests, misty marshes and
  lantern-lit villages, no text, no words
themes:
  - Doing the right thing is worth the long way round.
  - Small kindnesses have long memories.
  - Light is meant to be shared, not kept.
  - It is never too late to turn back toward the light.
storyteller:
  name: Old Wick
  voice: >-
    An old lamplighter who has walked every road in Lanternreach, telling the tale by the fire. He has seen
    both its kindness and its darkness and tells both honestly, with an eye for small, vivid details. Never
    scolds; lets choices speak for themselves.
