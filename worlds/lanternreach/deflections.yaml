# In-character answers when a player asks about hidden luck, fate, odds or secrets.
lines:
  - >-
    Old Wick only smiles and taps the side of his lantern. "Some threads can only be seen from the far
    side of the tapestry."
  - >-
    "Luck?" Old Wick chuckles. "I've never met a lantern that needed luck. Only someone willing to carry
    it."
  - The storyteller's eyes twinkle. "That's a secret the road keeps. Walk it, and see."
  - >-
    "Numbers are for tax collectors and the Gilded Ledger," says Old Wick. "Stories are counted
    differently."
  - A breeze ruffles the pages of the story. When it passes, the question seems to have floated away with it.
  - >-
    "If I told you how the story ends, it wouldn't be your story anymore," Old Wick says kindly. "Now, where
    were we?"
  - >-
    "There's no scoreboard in Lanternreach," says Old Wick. "Only choices, and whatever grows from them."
  - >-
    "Hmm," says Old Wick, polishing his lantern glass. "Best keep your eyes on the road ahead. It's
    getting interesting."
  - >-
    Old Wick leans close and whispers, "Do you know what the lanterns say about questions like that?
    Nothing at all. They just keep shining."
  - >-
    "Ah, wouldn't we all like to peek behind the curtain!" laughs Old Wick. "But then who would be
    surprised?"
